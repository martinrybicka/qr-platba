name: Test and publish container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$image:latest" -t "$image:sha-${GITHUB_SHA:0:12}" .
          docker run --rm --entrypoint python "$image:latest" -c \
            'from app import qr_png; from spayd import generate_spayd; code, _ = generate_spayd("1265098001/5500", "1250,00"); assert qr_png(code).startswith(bytes.fromhex("89504e470d0a1a0a"))'
          docker push --all-tags "$image"
